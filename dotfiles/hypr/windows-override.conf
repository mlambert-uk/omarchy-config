# Window rules override - prioritize workspace assignment over tiling
# This overrides the Omarchy default that forces chromium-based browsers into tiling mode
# The original rule was a workaround for an old --app bug that no longer applies
# See: ~/.local/share/omarchy/default/hypr/apps/browser.conf

# Remove the force-tiling rule for regular Chromium windows to allow workspace assignment
# to take precedence. This allows exec-once = [workspace X] to work correctly.
windowrule = tile off, match:class chromium
windowrule = tile off, match:class google-chrome
windowrule = tile off, match:class brave-browser
windowrule = tile off, match:class microsoft-edge
windowrule = tile off, match:class Vivaldi-stable
windowrule = tile off, match:class helium

# Keep the original rules for opacity and other settings
# (These are harmless and improve visual appearance)
